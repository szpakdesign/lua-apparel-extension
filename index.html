<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lua: Chrome extension prototype (minimal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
/* Minimal version, Nov 26, 2026. Values are read from Figma, section "7. Chrome extension · Simple" (screens 7.0 to 7.13) and the component "Extension: Window". */
:root {
  --lua-surface: #F4F2ED; --lua-primary: #2B2721; --lua-control: #ECE9E4;
  --text-secondary: rgba(0,0,0,.72); --text-button: #4A4A4A; --stroke-subtle: rgba(0,0,0,.10); --stroke-card: rgba(0,0,0,.16);
  --panel: 379px; --bar-h: 48px;
  /* extension colours, Light (Figma 7.0 to 7.9) */
  --x-chrome: #FFFFFF; --x-chrome-text: #000000; --x-tool: #4A4A4A; --x-tool-hover: rgba(0,0,0,.06); --x-surface: #F4F2ED; --x-primary: #2B2721; --x-on-primary: #F5F5F5; --x-control: #ECE9E4;
  --x-text-2: rgba(0,0,0,.72); --x-btn-text: #4A4A4A; --x-stroke: rgba(0,0,0,.10); --x-card-stroke: rgba(0,0,0,.16); --x-disabled: #E6E2DA; --x-on-disabled: #A8A195; --x-toast-text: #FFFFFF; --x-check-border: #7A7A7A; --x-check-bg: #FFFFFF; --x-spin-track: rgba(0,0,0,.10); --x-on-primary-track: rgba(255,255,255,.24);
  /* Serenity motion tokens */
  --m-feedback: 100ms; --m-toggle: 150ms; --m-enter-s: 150ms; --m-enter-m: 250ms; --m-exit-s: 100ms; --m-exit-m: 200ms; --m-stagger: 50ms; --m-spin: 800ms;
  --e-default: cubic-bezier(.2,0,0,1); --e-enter: cubic-bezier(0,0,0,1); --e-exit: cubic-bezier(.3,0,1,1);
  --d-s: 4px; --d-m: 16px; --pop: .96; --press: .98;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { padding-bottom: var(--bar-h); background: #fff; color: var(--lua-primary); font: 400 14px/20px Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--lua-primary); outline-offset: 2px; }
.page { height: 100%; }
.tile::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.3); opacity: 0; transition: opacity var(--m-enter-s) var(--e-enter); pointer-events: none; }
/* Button in the centre of a photo on hover (Figma: Extension: Save button) */
.tile-action { position: absolute; left: 50%; top: 50%; z-index: 1; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 6px 10px 6px 8px; border: 0; border-radius: 9999px; background: var(--lua-surface); color: var(--lua-primary); font-size: 14px; line-height: 20px; white-space: nowrap; opacity: 0; transform: translate(-50%, -50%) scale(var(--pop)); transition: opacity var(--m-enter-s) var(--e-enter), transform var(--m-enter-s) var(--e-enter); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.08); }
.tile-action svg { width: 20px; height: 16px; flex: none; }
.tile-action .x { width: 16px; height: 16px; }
.tile-action:active { transform: translate(-50%, -50%) scale(var(--press)); }
.tile-action.is-label { background: var(--lua-control); box-shadow: none; cursor: default; }
.tile:hover::after, .tile:focus-within::after { opacity: 1; }
.tile:hover .tile-action, .tile .tile-action:focus-visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.tile:hover img { transform: scale(1.02); }
body.no-hover-btn .tile:not(.is-picked):not(.is-added)::after, body.no-hover-btn .tile:not(.is-picked):not(.is-added) .tile-action { display: none; }
body.is-busy .tile::after, body.is-busy .tile-action, body.signed-out .tile::after, body.signed-out .tile-action { display: none; }
/* Selected or in Lua: the small Lua mark in the top right corner */
.tile-mark { position: absolute; right: 8px; top: 8px; z-index: 1; width: 20px; height: 20px; display: none; place-items: center; border-radius: 9999px; background: var(--lua-surface); color: var(--lua-primary); }
.tile-mark svg { width: 12px; height: 10px; }
.tile.is-picked .tile-mark, .tile.is-added .tile-mark { display: grid; animation: pop var(--m-enter-m) var(--e-default) both; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } }
/* The extension window (Figma: Extension: Window), 344 px, 8 px from the top and right */
.xwin { position: fixed; right: 8px; top: 8px; z-index: 30; width: 344px; display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--stroke-card); border-radius: 16px; background: var(--lua-surface); box-shadow: 0 0 0 1px rgba(0,0,0,.02), 0 1px 1px rgba(0,0,0,.04), 0 2px 2px rgba(0,0,0,.04), 0 4px 4px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.08); animation: win-in var(--m-enter-m) var(--e-enter) both; transform-origin: top right; }
@keyframes win-in { from { opacity: 0; transform: translateY(calc(var(--d-s) * -1)) scale(var(--pop)); } }
.xwin.is-fresh > * { animation: fade-in var(--m-enter-m) var(--e-enter) both; }
@keyframes fade-in { from { opacity: 0; transform: translateY(var(--d-s)); } }
.head { position: relative; display: flex; align-items: center; gap: 8px; min-height: 32px; }
.head h2 { flex: 1; margin: 0; font: 500 18px/24px Inter, sans-serif; color: var(--lua-primary); }
.head .logo { width: 29px; height: 24px; color: var(--lua-primary); }
.icon-btn { flex: none; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 9999px; background: transparent; color: var(--text-button); transition: background var(--m-feedback) var(--e-default), transform var(--m-feedback) var(--e-default); }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: rgba(0,0,0,.06); }
.icon-btn:active { transform: scale(var(--press)); }
.back { margin-left: -8px; }
.desc { margin: 0; font-size: 12px; line-height: 18px; color: var(--text-secondary); }
.desc-row { display: flex; align-items: center; gap: 6px; }
.kbd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px 2px; border-radius: 9999px; background: var(--lua-control); color: var(--text-button); font: 400 12px/18px "IBM Plex Mono", ui-monospace, Menlo, monospace; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.btn { width: 100%; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border: 1px solid transparent; border-radius: 9999px; font-size: 14px; line-height: 20px; text-decoration: none; font-variant-numeric: tabular-nums; transition: opacity var(--m-feedback) var(--e-default), background var(--m-feedback) var(--e-default), transform var(--m-feedback) var(--e-default); }
.btn--xs { height: 32px; padding: 0 12px; }
.btn:not(:disabled):active { transform: scale(var(--press)); }
.btn--solid { background: var(--lua-primary); color: #F5F5F5; }
.btn--solid:hover { opacity: .9; }
.btn--outlined { background: transparent; border-color: var(--stroke-subtle); color: var(--text-button); }
.btn--outlined:hover { background: rgba(0,0,0,.04); }
.btn--ghost { background: transparent; color: var(--text-button); }
.btn--ghost:hover { background: rgba(0,0,0,.04); }
.btn:disabled { color: #9A9A9A; cursor: default; }
.btn--outlined:disabled:hover { background: transparent; }
.btn--google { height: 48px; padding: 4px 20px 4px 16px; font-size: 16px; background: var(--lua-primary); color: #fff; }
.btn svg { flex: none; }
.btn .kbd { margin-left: 2px; }
.spinner { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(0,0,0,.10); border-top-color: var(--lua-primary); animation: spin var(--m-spin) linear infinite; }
.btn--solid .spinner { border-color: rgba(255,255,255,.24); border-top-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }
.menu { position: absolute; right: 0; top: 40px; z-index: 4; width: 240px; padding: 4px; border: 1px solid var(--stroke-subtle); border-radius: 12px; background: var(--lua-surface); box-shadow: 0 8px 24px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.08); transform-origin: top right; animation: menu-in var(--m-enter-s) var(--e-enter) both; }
@keyframes menu-in { from { opacity: 0; transform: scale(var(--pop)); } }
.menu-user { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
.menu-user img { flex: none; width: 32px; height: 32px; border-radius: 9999px; object-fit: cover; }
.menu-user b, .acct b { display: block; font-weight: 400; font-size: 14px; line-height: 20px; color: var(--lua-primary); }
.menu-user span { display: block; font-size: 12px; line-height: 16px; color: var(--text-secondary); }
.sep { height: 1px; margin: 4px 0; background: var(--stroke-subtle); border: 0; }
.menu button { width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--lua-primary); font-size: 14px; line-height: 20px; text-align: left; transition: background var(--m-feedback) var(--e-default); }
.menu button:hover, .menu button:focus-visible { background: rgba(0,0,0,.06); }
.acct { display: flex; align-items: center; gap: 12px; }
.acct img { flex: none; width: 40px; height: 40px; border-radius: 9999px; object-fit: cover; }
.acct span, .row span { display: block; font-size: 12px; line-height: 18px; color: var(--text-secondary); }
.row { display: flex; align-items: center; gap: 12px; }
.row > div { flex: 1; min-width: 0; }
.row b { display: block; font-weight: 400; font-size: 14px; line-height: 20px; }
.switch { flex: none; position: relative; width: 36px; height: 20px; padding: 0; border: 0; border-radius: 9999px; background: var(--lua-control); transition: background var(--m-toggle) var(--e-default); }
.switch::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 9999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform var(--m-toggle) var(--e-default); }
.switch[aria-checked="true"] { background: var(--lua-primary); }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--lua-surface); }
/* Toast under the window, as wide as the window (Figma 7.8 to 7.10) */
.toast { position: fixed; right: 8px; z-index: 29; width: 344px; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px; border-radius: 12px; background: var(--lua-primary); color: #fff; font-size: 16px; line-height: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.1); animation: toast-in var(--m-enter-m) var(--e-enter) both; }
.toast span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.is-leaving { animation: toast-out var(--m-exit-m) var(--e-exit) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }
.toast button, .toast a { flex: none; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; border: 0; border-radius: 9999px; background: transparent; color: inherit; font-size: 14px; line-height: 20px; text-decoration: none; transition: background var(--m-feedback) var(--e-default); }
.toast .close { width: 32px; padding: 0; }
.toast button:hover, .toast a:hover { background: rgba(255,255,255,.12); }
/* Prototype controls: not part of the extension */
.demo-bar { position: fixed; inset: auto 0 0 0; z-index: 40; height: var(--bar-h); display: flex; align-items: center; gap: 8px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; background: #fff; box-shadow: 0 -1px 0 rgba(0,0,0,.10); }
.demo-bar::-webkit-scrollbar { display: none; }
.demo-sep { flex: none; width: 1px; height: 16px; margin-inline: 4px; background: rgba(0,0,0,.10); }
.demo-label { flex: none; font-size: 12px; line-height: 16px; color: var(--text-secondary); }
.tag { flex: none; display: inline-flex; align-items: center; height: 32px; padding: 0 10px; border: 0; border-radius: 9999px; background: transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.10); color: #4A4A4A; font-size: 14px; line-height: 20px; text-decoration: none; transition: background var(--m-feedback) var(--e-default), transform var(--m-feedback) var(--e-default); }
.tag:hover { background: rgba(0,0,0,.04); }
.tag:active { transform: scale(var(--press)); }
.tag[aria-pressed="true"], .tag[aria-current="page"] { background: #1A1A1A; box-shadow: none; color: #fff; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } .spinner { animation: none; } }
@media (max-width: 900px) { .identity { gap: 24px; } }

/* The page being browsed: a sample profile, not Lua UI */
.page { flex: 1; min-width: 0; height: 100%; overflow-y: auto; background: #fff; transition: border-radius var(--m-enter-m) var(--e-default); }
/* As in Chrome: the page's corner next to the side panel is rounded and the panel's colour shows behind it (Figma comment 169) */
body.panel-open .page { border-top-right-radius: 8px; }
.profile { width: 804px; max-width: calc(100% - 32px); margin: 0 auto; padding: 40px 0 40px; }
.identity { display: flex; gap: 48px; padding-inline: 24px; min-height: 128px; }
.identity img { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; flex: none; }
.identity h1 { margin: 0; font: 500 24px/48px Inter, sans-serif; }
.stats { display: flex; gap: 24px; margin: 8px 0 0; padding: 0; list-style: none; font-weight: 500; }
.bio { margin: 10px 0 0; font-size: 12px; line-height: 20px; }
.stories { display: flex; gap: 40px; margin: 38px 0 0; padding: 2px 24px; list-style: none; overflow-x: auto; scrollbar-width: none; }
.stories li { flex: none; width: 72px; display: flex; flex-direction: column; align-items: center; gap: 8px; font: 500 12px/20px Inter, sans-serif; }
.stories img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px #DBDBDB; }
.divider { height: 1px; margin: 24px 0 24px; border: 0; background: #E6E6E6; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0; padding: 0; list-style: none; }
.tile { position: relative; aspect-ratio: 264 / 330; overflow: hidden; background: var(--lua-control); }
.tile:first-child { border-top-left-radius: 12px; } .tile:nth-child(3) { border-top-right-radius: 12px; }
.tile:nth-last-child(3) { border-bottom-left-radius: 12px; } .tile:last-child { border-bottom-right-radius: 12px; }
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tile img { transition: transform var(--m-enter-m) var(--e-default); }
</style>
</head>

    <button class="tag" type="button" data-demo="empty" aria-pressed="false">No outfits</button>
  </div>
</div>

  var MORE_I = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.25"/><circle cx="12" cy="12" r="1.25"/><circle cx="18.5" cy="12" r="1.25"/></svg>';
  var BACK_I = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.25 6L4.25 12L10.25 18M4.25 12H19.75"/></svg>';
  var GEAR_I = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
  var OUT_I = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.25 16L20.25 12L16.25 8M20.25 12H9M10.5 3.75H7.12C4.42 3.75 3.75 4.42 3.75 7.12V16.88C3.75 19.57 4.42 20.25 7.12 20.25H10.5"/></svg>';
  var EXT_I = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10V4H14M20 4L11.5 12.5M11 4H7.5C4.7 4 4 4.7 4 7.5V16.5C4 19.3 4.7 20 7.5 20H16.5C19.3 20 20 19.3 20 16.5V13"/></svg>';
  var OK_I = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#6BBA84" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M6.8 10.2l2.2 2.2 4.2-4.6"/></svg>';
  var BAD_I = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#F0857D" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 6.5v4M10 13.4v.1"/></svg>';
  var INFO_I = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v4.5M10 6.6v.1"/></svg>';
  var CLOSE_I = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  var s = { view: params.has('signedin') ? 'idle' : 'signin', list: [], added: {}, menu: false, hoverBtn: true, toast: null, failOnce: params.has('fail') };
  var noOutfits = params.has('empty');
  var win = document.getElementById('win'), grid = document.getElementById('grid'), page = document.getElementById('page'), slot = document.getElementById('toast-slot');
  var findTimer = null, addTimer = null, toastTimer = null, hovered = null, lastKey = '';
  function src(i) { return '/img/post-' + String(i + 1).padStart(2, '0') + '.jpg'; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function plural(n) { return n + (n === 1 ? ' image' : ' images'); }
  function kbd(k) { return '<kbd class="kbd">' + k + '</kbd>'; }

  grid.innerHTML = POSTS.map(function (t, i) {
    return '<li class="tile" data-i="' + i + '"><img src="' + src(i) + '" alt="' + esc(t) + '"><button class="tile-action" type="button" data-i="' + i + '"></button><span class="tile-mark" aria-hidden="true">' + SYMBOL + '</span></li>';
  }).join('');

  function head(title, opts) {
    opts = opts || {};
    if (opts.logo) return '<div class="head"><span class="logo">' + SYMBOL + '</span></div>';
    var menu = s.menu ? '<div class="menu" role="menu" aria-label="Account"><div class="menu-user"><img src="/img/account.jpg" alt=""><div><b>Alex Morgan</b><span>alex.morgan@gmail.com</span></div></div><hr class="sep"><button role="menuitem" type="button" data-act="settings">' + GEAR_I + 'Settings</button><button role="menuitem" type="button" data-act="signout">' + OUT_I + 'Sign out</button></div>' : '';
    return '<div class="head">' + (opts.back ? '<button class="icon-btn back" type="button" data-act="back" aria-label="Back">' + BACK_I + '</button>' : '') + (opts.spinner ? '<span class="spinner" role="progressbar" aria-label="Looking for outfits"></span>' : '') + '<h2>' + title + '</h2>' + (opts.more === false ? '' : '<button class="icon-btn" type="button" data-act="menu" aria-label="More" aria-haspopup="menu" aria-expanded="' + s.menu + '">' + MORE_I + '</button>' + menu) + '</div>';
  }
  function render() {
    var n = s.list.length, h = '', key;
    if (s.view === 'signin') {
      key = 'signin';
      h = head(null, { logo: true }) + '<p class="desc">Save photos from any site to Lua.</p><button class="btn btn--google" type="button" data-act="signin">' + GOOGLE + 'Continue with Google</button>';
    } else if (s.view === 'settings') {
      key = 'settings';
      h = head('Settings', { back: true, more: false })
        + '<div class="acct"><img src="/img/account.jpg" alt=""><div><b>Alex Morgan</b><span>alex.morgan@gmail.com</span></div></div>'
        + '<div class="row"><div><b id="set-hover">Button on photos</b><span>Show Add to Lua on hover</span></div><button class="switch" type="button" role="switch" aria-labelledby="set-hover" aria-checked="' + s.hoverBtn + '" data-act="hover-btn"></button></div>'
        + '<div class="row"><div><b>Shortcut</b><span>Adds the photo you point at</span></div>' + kbd('Alt+L') + '</div>'
        + '<a class="btn btn--outlined btn--xs" href="https://lua-apparel.vercel.app/" target="_blank" rel="noopener">Open Lua' + EXT_I + '</a>'
        + '<hr class="sep" style="margin:0">'
        + '<button class="btn btn--ghost btn--xs" type="button" data-act="signout">' + OUT_I + 'Sign out</button>';
    } else if (s.view === 'finding') {
      key = 'finding';
      h = head('Looking for outfits', { spinner: true }) + '<p class="desc">Finding every outfit on this page.</p><button class="btn btn--outlined" type="button" data-act="cancel-find">Cancel</button>';
    } else if (n) {
      key = 'list'; var adding = s.view === 'adding';
      h = head(plural(n) + ' to add') + '<p class="desc">Click Add to Lua on more photos, or add these now.</p><div class="actions">'
        + (adding ? '<button class="btn btn--solid btn--xs" type="button" aria-disabled="true" aria-label="Adding ' + plural(n) + '"><span class="spinner" aria-hidden="true"></span></button>' : '<button class="btn btn--solid btn--xs" type="button" data-act="add">Add ' + plural(n) + '</button>')
        + '<button class="btn btn--outlined btn--xs" type="button" data-act="clear"' + (adding ? ' disabled' : '') + '>Unselect all</button></div>';
    } else {
      key = 'idle';
      h = head('Select photos to add') + '<p class="desc">Hover a photo and click Add to Lua.</p><div class="desc-row"><span class="desc">Or point at it and press</span>' + kbd('Alt+L') + '</div><button class="btn btn--outlined" type="button" data-act="find" aria-keyshortcuts="Alt+A">Find all outfits on this page' + kbd('Alt+A') + '</button>';
    }
    win.innerHTML = h;
    win.classList.toggle('is-fresh', key !== lastKey); lastKey = key;
    document.body.classList.toggle('signed-out', s.view === 'signin');
    document.body.classList.toggle('is-busy', s.view === 'adding' || s.view === 'finding');
    [].forEach.call(grid.children, function (li, i) {
      var picked = s.list.indexOf(i) > -1, added = !!s.added[i], b = li.querySelector('.tile-action');
      li.classList.toggle('is-picked', picked); li.classList.toggle('is-added', added && !picked);
      b.classList.toggle('is-label', added && !picked);
      b.innerHTML = picked ? X + 'Remove' : (added ? SYMBOL + 'In Lua' : SYMBOL + 'Add to Lua');
      b.setAttribute('aria-label', picked ? 'Remove from the selection' : (added ? 'In Lua' : 'Add to Lua'));
      if (added && !picked) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    });
    renderToast();
    syncDemo();
  }
  function renderToast() {
    var t = s.toast, h = '';
    if (t) {
      if (t.kind === 'added') h = '<div class="toast" role="status">' + OK_I + '<span>' + plural(t.n) + ' added</span><a href="https://lua-apparel.vercel.app/" target="_blank" rel="noopener">View</a><button class="close" type="button" data-act="toast-close" aria-label="Close">' + CLOSE_I + '</button></div>';
      else if (t.kind === 'failed') h = '<div class="toast" role="alert">' + BAD_I + '<span>Couldn\'t add</span><button type="button" data-act="add">Try again</button><button class="close" type="button" data-act="toast-close" aria-label="Close">' + CLOSE_I + '</button></div>';
      else h = '<div class="toast" role="status">' + INFO_I + '<span>No outfits on this page</span></div>';
    }
    var same = slot.firstChild && slot.dataset.k === (t ? t.kind + (t.n || '') : '');
    if (!same) { slot.innerHTML = h; slot.dataset.k = t ? t.kind + (t.n || '') : ''; }
    var el = slot.firstChild; if (el) el.style.top = (win.offsetTop + win.offsetHeight + 8) + 'px';
  }
  function toast(t, ms) {
    s.toast = t; clearTimeout(toastTimer);
    if (ms) toastTimer = setTimeout(function () { var el = slot.firstChild; if (el) el.classList.add('is-leaving'); toastTimer = setTimeout(function () { s.toast = null; render(); }, 200); }, ms);
  }
  function pick(i) {
    if (s.view === 'signin' || s.view === 'adding' || s.view === 'finding') return;
    if (s.added[i] && s.list.indexOf(i) === -1) return;
    if (s.view === 'settings') s.view = 'idle';
    var at = s.list.indexOf(i);
    if (at === -1) s.list.push(i); else s.list.splice(at, 1);
    s.menu = false; if (s.toast && s.toast.kind !== 'added') s.toast = null; render();
  }
  function find() {
    if (s.view === 'signin' || s.view === 'adding') return;
    s.view = 'finding'; s.menu = false; s.toast = null; render();
    findTimer = setTimeout(function () {
      s.view = 'idle';
      // What has loaded so far: every photo from the top of the page down to the bottom edge of the window.
      var edge = page.getBoundingClientRect().bottom, found = [];
      [].forEach.call(grid.children, function (li, i) { if (li.getBoundingClientRect().top < edge && !s.added[i]) found.push(i); });
      if (noOutfits) found = [];
      if (!found.length && !s.list.length) { toast({ kind: 'none' }, 5000); render(); return; }
      found.forEach(function (i) { if (s.list.indexOf(i) === -1) s.list.push(i); });
      s.list.sort(function (a, b) { return a - b; }); render();
    }, 1600);
  }
  function add() {
    var items = s.list.slice(); if (!items.length || s.view === 'adding') return;
    s.view = 'adding'; s.toast = null; clearTimeout(toastTimer); render();
    addTimer = setTimeout(function () {
      s.view = 'idle';
      if (s.failOnce) { s.failOnce = false; toast({ kind: 'failed' }); render(); return; }
      items.forEach(function (i) { s.added[i] = true; });
      s.list = []; toast({ kind: 'added', n: items.length }, 6000); render();
    }, 1800);
  }
  function act(a, el) {
    if (a === 'find') find();
    else if (a === 'add') add();
    else if (a === 'clear') { s.list = []; render(); }
    else if (a === 'cancel-find') { clearTimeout(findTimer); s.view = 'idle'; render(); }
    else if (a === 'signin') { s.view = 'idle'; render(); }
    else if (a === 'menu') { s.menu = !s.menu; render(); var f = win.querySelector(s.menu ? '.menu button' : '[data-act="menu"]'); if (f) f.focus(); }
    else if (a === 'settings') { s.menu = false; s.view = 'settings'; render(); var bk = win.querySelector('.back'); if (bk) bk.focus(); }
    else if (a === 'back') { s.view = 'idle'; render(); }
    else if (a === 'hover-btn') { s.hoverBtn = !s.hoverBtn; document.body.classList.toggle('no-hover-btn', !s.hoverBtn); render(); var sw = win.querySelector('.switch'); if (sw) sw.focus(); }
    else if (a === 'signout') { clearTimeout(findTimer); clearTimeout(addTimer); s.menu = false; s.view = 'signin'; s.list = []; s.toast = null; render(); }
    else if (a === 'toast-close') { s.toast = null; clearTimeout(toastTimer); render(); }
  }
  win.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b); });
  slot.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b); });
  grid.addEventListener('click', function (e) { var b = e.target.closest('.tile-action'); if (b && b.getAttribute('aria-disabled') !== 'true') pick(+b.dataset.i); });
  grid.addEventListener('mouseover', function (e) { var li = e.target.closest('.tile'); hovered = li ? +li.dataset.i : null; });
  grid.addEventListener('mouseleave', function () { hovered = null; });
  document.addEventListener('keydown', function (e) {
    if (e.altKey && e.code === 'KeyL' && hovered !== null) { e.preventDefault(); pick(hovered); }
    else if (e.altKey && e.code === 'KeyA') { e.preventDefault(); find(); }
    else if (e.key === 'Escape' && s.menu) { s.menu = false; render(); }
  });
  document.addEventListener('click', function (e) { if (s.menu && !e.target.closest('.menu') && !e.target.closest('[data-act="menu"]')) { s.menu = false; render(); } });
  window.addEventListener('resize', renderToast);
  // Prototype controls
  function syncDemo() { var on = { signin: s.view === 'signin', fail: s.failOnce, empty: noOutfits }; [].forEach.call(document.querySelectorAll('[data-demo]'), function (b) { b.setAttribute('aria-pressed', on[b.dataset.demo] ? 'true' : 'false'); }); }
  document.querySelector('.demo-bar').addEventListener('click', function (e) {
    var d = e.target.closest('[data-demo]'); if (!d) return;
    if (d.dataset.demo === 'signin') { s.view = s.view === 'signin' ? 'idle' : 'signin'; s.toast = null; s.menu = false; }
    else if (d.dataset.demo === 'fail') s.failOnce = !s.failOnce;
    else noOutfits = !noOutfits;
    render();
  });
  // Keep the address's states when switching versions
  [].forEach.call(document.querySelectorAll('[data-version]'), function (a) { a.href = a.getAttribute('href') + location.search; });
  render();

})();
</script>
</body>
</html>
